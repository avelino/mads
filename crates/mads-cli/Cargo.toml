[package]
name = "mads-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "mads: generate Google Ads campaigns from a business description"

[[bin]]
name = "mads"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = "0.18.6"
mads-core = { path = "../mads-core" }
mads-providers = { path = "../mads-providers" }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
