[package]
name = "mads-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "mads: generate Google Ads campaigns from a business description"

[[bin]]
name = "mads"
path = "src/main.rs"

[features]
default = ["serve"]
serve = [
    "dep:ammonia",
    "dep:askama",
    "dep:axum",
    "dep:fs2",
    "dep:mime_guess",
    "dep:pulldown-cmark",
    "dep:rust-embed",
    "dep:serde",
    "dep:subtle",
    "dep:time",
    "dep:toml",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:uuid",
]

[dependencies]
ammonia = { version = "4.2.4", optional = true }
anyhow = "1.0.104"
askama = { version = "0.16.1", optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
fs2 = { version = "0.4.3", optional = true }
indicatif = "0.18.6"
mads-core = { path = "../mads-core" }
mads-providers = { path = "../mads-providers" }
mime_guess = { version = "2.0.5", optional = true }
pulldown-cmark = { version = "0.13.5", optional = true }
rust-embed = { version = "8.13.0", features = ["mime-guess"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = "1.0.151"
subtle = { version = "2.6.1", optional = true }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"], optional = true }
toml = { version = "1.1.6", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
tokio-util = { version = "0.7.19", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"], optional = true }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
calamine = "0.37.0"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
