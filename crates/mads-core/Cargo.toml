[package]
name = "mads-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
csv = "1.4.0"
futures = "0.3.34"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "fs"] }
toml = "1.1.6"
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }
